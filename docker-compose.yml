version: '3.8'

services:
  app:
    build: .
    restart: always
    volumes:
      - db_data:/app/data
    expose:
      - 8000

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - app
    command: /bin/bash -c "openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/certs/nginx-selfsigned.key -out /etc/nginx/certs/nginx-selfsigned.crt -subj '/C=US/ST=CA/L=SF/O=MyOrg/OU=MyDept/CN=34.204.18.104' && nginx -g 'daemon off;'"

volumes:
  certs:
  db_data:
