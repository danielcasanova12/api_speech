version: '3.8'

services:
  db:
    image: postgres:13
    container_name: speech_api_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    volumes:
      - postgres_data:/app/data
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - app
    command: /bin/bash -c "openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/certs/nginx-selfsigned.key -out /etc/nginx/certs/nginx-selfsigned.crt -subj '/C=US/ST=CA/L=SF/O=MyOrg/OU=MyDept/CN=34.204.18.104' && nginx -g 'daemon off;'"

volumes:
  certs:
  postgres_data:
